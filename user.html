<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registered Users</title>

<style>

body{
    font-family:Arial;
    padding:40px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

table{

    width:100%;
    border-collapse:collapse;
    background:white;

}

th,td{

padding:12px;
border:1px solid #ccc;
text-align:center;

}

th{

background:#007bff;
color:white;

}

</style>

</head>

<body>

<h1>Registered Users</h1>

<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>

</tr>

</thead>

<tbody id="usersTable">

</tbody>

</table>

<script>

async function loadUsers(){

const res=await fetch("/api/users");

const users=await res.json();

let html="";

users.forEach(user=>{

html+=`

<tr>

<td>${user.id}</td>

<td>${user.name}</td>

<td>${user.email}</td>

<td>${user.phone}</td>

</tr>

`;

});

document.getElementById("usersTable").innerHTML=html;

}

loadUsers();

</script>

</body>

</html>
